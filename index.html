<style>
/* ══════════════════════════════════════
   RESET & VARIABLES GLOBALES
══════════════════════════════════════ */
*, *::before, *::after { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

:root {
  --bg: #0e0e10; 
  --surface: #16161a; 
  --panel: #1c1c22; 
  --border: #2a2a35;
  --accent: #e8ff47; 
  --accent2: #47c8ff; 
  --text: #e8e8f0; 
  --muted: #6b6b80;
  --danger: #ff6b6b; 
  --warn: #ffb347; 
  --radius: 8px;
  --grid: #2a2a35; 
  --shadow: rgba(0,0,0,.5); 
  --scroll: #2a2a35;
}

[data-theme="light"] {
  --bg: #f0f0f5; 
  --surface: #ffffff; 
  --panel: #f5f5fa; 
  --border: #d0d0de;
  --accent: #4a6800; 
  --accent2: #0055a0; 
  --text: #16161e; 
  --muted: #80809a;
  --danger: #c02020; 
  --warn: #b86000;
  --grid: #d8d8ea; 
  --shadow: rgba(0,0,0,.1); 
  --scroll: #c0c0d0;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  overflow: hidden;
  transition: background .3s, color .3s;
}

.app {
  display: grid;
  grid-template-rows: auto auto 1fr;
  grid-template-columns: 1fr;
  height: 100vh;
  height: 100dvh;
}

/* ══════════════════════════════════════
   HEADER
══════════════════════════════════════ */
.hdr {
  display: flex; 
  align-items: center; 
  gap: 12px; 
  padding: 10px 18px;
  border-bottom: 1px solid var(--border); 
  background: var(--surface);
  transition: background .3s, border-color .3s;
  min-height: 52px;
}

.hdr-title { 
  font-family: 'Syne', sans-serif; 
  font-weight: 800; 
  font-size: 17px; 
  letter-spacing: -.5px; 
  white-space: nowrap;
}

.hdr-title em { 
  color: var(--accent); 
  font-style: normal; 
}

.hdr-tag {
  font-size: 9px; 
  letter-spacing: 2px; 
  text-transform: uppercase; 
  color: var(--muted);
  background: var(--panel); 
  border: 1px solid var(--border); 
  padding: 2px 7px; 
  border-radius: 4px;
  white-space: nowrap;
}

.hdr-right { 
  margin-left: auto; 
  display: flex; 
  align-items: center; 
  gap: 10px; 
  flex-wrap: wrap; 
  justify-content: flex-end;
}

.stats { 
  display: flex; 
  gap: 16px; 
  align-items: center;
}

.stat { 
  display: flex; 
  align-items: center; 
  gap: 5px; 
  font-size: 10px; 
  color: var(--muted); 
}

.stat-n { 
  font-family: 'Syne', sans-serif; 
  font-weight: 700; 
  font-size: 13px; 
  color: var(--text); 
}

.hbtn {
  width: 32px; 
  height: 32px; 
  border-radius: 7px; 
  border: 1px solid var(--border);
  background: var(--panel); 
  color: var(--text); 
  cursor: pointer; 
  display: flex;
  align-items: center; 
  justify-content: center; 
  font-size: 14px; 
  transition: all .15s;
}

.hbtn:hover { 
  border-color: var(--accent); 
  color: var(--accent); 
}

.hbtn:disabled { 
  opacity: 0.3; 
  cursor: not-allowed; 
  pointer-events: none; 
}

.hbtn.mic-on { 
  border-color: var(--danger); 
  color: var(--danger); 
  animation: micpulse 1s infinite; 
}

.hbtn.paused { 
  border-color: var(--warn); 
  color: var(--warn); 
}

@keyframes micpulse { 
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,.4); } 
  50% { box-shadow: 0 0 0 6px rgba(255,107,107,0); } 
}

.lang-sel {
  font-family: 'DM Mono', monospace; 
  font-size: 10px; 
  letter-spacing: .5px;
  background: var(--panel); 
  border: 1px solid var(--border); 
  color: var(--text);
  padding: 6px 8px; 
  border-radius: 7px; 
  cursor: pointer; 
  outline: none; 
  transition: border-color .15s;
}

.lang-sel:hover { 
  border-color: var(--accent); 
}

.menu-btn-mobile {
  display: none;
}

/* ══════════════════════════════════════
   TOP NAVIGATION BAR (TOOLBAR & SIDEBAR)
══════════════════════════════════════ */
.toolbar {
  background: var(--surface); 
  border-bottom: 1px solid var(--border);
  display: flex; 
  gap: 20px; 
  padding: 12px 18px; 
  overflow-x: auto; 
  align-items: stretch;
  transition: background .3s, border-color .3s, left .3s cubic-bezier(0.4, 0, 0.2, 1);
  scrollbar-width: thin;
}

.toolbar::-webkit-scrollbar { height: 6px; }
.toolbar::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }

.mobile-menu-header { display: none; }

.sec {
  display: flex; 
  flex-direction: column; 
  gap: 6px; 
  min-width: max-content;
  border-right: 1px solid var(--border); 
  padding-right: 20px; 
  justify-content: center;
}

.sec:last-child { border-right: none; padding-right: 0; }

.sec-lbl { 
  font-size: 8px; 
  letter-spacing: 2px; 
  text-transform: uppercase; 
  color: var(--muted); 
  margin-bottom: 2px; 
}

.row { display: flex; gap: 6px; align-items: center; }

input[type=number] {
  background: var(--panel); 
  border: 1px solid var(--border); 
  border-radius: var(--radius);
  color: var(--text); 
  font-family: 'DM Mono', monospace; 
  font-size: 14px; 
  padding: 6px 10px; 
  outline: none; 
  transition: border-color .15s; 
  -moz-appearance: textfield; 
  width: 85px;
}

input[type=number]::-webkit-outer-spin-button, 
input[type=number]::-webkit-inner-spin-button { 
  -webkit-appearance: none; 
}

input[type=number]:focus { border-color: var(--accent); }
input[type=number]::placeholder { color: var(--muted); font-size: 12px; }

.btn {
  font-family: 'DM Mono', monospace; 
  font-size: 11px; 
  font-weight: 500; 
  border: none;
  border-radius: var(--radius); 
  cursor: pointer; 
  transition: all .15s; 
  padding: 8px 12px; 
  white-space: nowrap;
}

.btn-acc { background: var(--accent); color: #0c0c10; }
[data-theme=light] .btn-acc { color: #fff; }
.btn-acc:hover { filter: brightness(1.1); }

.btn-gh { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
.btn-gh:hover { border-color: var(--accent2); color: var(--accent2); }

.btn-del { background: transparent; color: var(--danger); border: 1px solid var(--danger); opacity: .65; }
.btn-del:hover { opacity: 1; background: rgba(255,80,80,.07); }

.btn-w { width: 100%; }
.btn-grid { display: flex; gap: 5px; flex: 1; }

.spd-row { display: flex; align-items: center; gap: 9px; margin-top: 4px; }
.spd-lbl { font-size: 10px; color: var(--muted); min-width: 32px; }

input[type=range] { 
  flex: 1; 
  -webkit-appearance: none; 
  height: 4px; 
  background: var(--border); 
  border-radius: 2px; 
  outline: none; 
}

input[type=range]::-webkit-slider-thumb { 
  -webkit-appearance: none; 
  width: 16px; 
  height: 16px; 
  border-radius: 50%; 
  background: var(--accent); 
  cursor: pointer; 
  border: 2px solid var(--bg); 
}

.spd-val { font-size: 10px; color: var(--accent); min-width: 26px; text-align: right; font-weight: bold; }

.log-sec { flex: 1; min-width: 250px; max-width: 400px; display: flex; flex-direction: column; height: 95px; }

.log-body {
  flex: 1; 
  overflow-y: auto; 
  padding: 6px 8px; 
  background: var(--panel);
  border: 1px solid var(--border); 
  border-radius: 6px; 
  font-size: 11px;
}

.log-body::-webkit-scrollbar { width: 4px; }
.log-body::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 2px; }

.log-entry { 
  padding: 2px 4px; 
  color: var(--muted); 
  line-height: 1.4; 
  animation: fi .2s ease; 
  border-bottom: 1px solid rgba(255,255,255,0.02); 
}

.log-entry:last-child { border-bottom: none; }
.log-entry.hl { color: var(--accent); } 
.log-entry.inf { color: var(--accent2); }
.log-entry.wn { color: var(--warn); } 
.log-entry.er { color: var(--danger); }

@keyframes fi { 
  from { opacity: 0; transform: translateX(-4px); } 
  to { opacity: 1; transform: none; } 
}

.saved-list {
  height: 60px; 
  overflow-y: auto; 
  background: var(--panel); 
  border: 1px solid var(--border);
  border-radius: 6px; 
  padding: 4px; 
  display: flex; 
  flex-direction: column; 
  gap: 4px;
}

.saved-list::-webkit-scrollbar { width: 4px; }
.saved-list::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 2px; }

/* ══════════════════════════════════════
   OVERLAY DEL SIDEBAR
══════════════════════════════════════ */
.sidebar-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 90;
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
.sidebar-overlay.active { opacity: 1; pointer-events: all; }

/* ══════════════════════════════════════
   CANVAS, OVERLAYS & ANIMATED BACKGROUNDS
══════════════════════════════════════ */
.cv-wrap { 
  position: relative; 
  overflow: hidden; 
  background: radial-gradient(circle at bottom right, #0e0e15 0%, #050508 100%); 
  transition: background .5s; 
}

@keyframes starDrift {
  0% { background-position: 0 0, 0 0, 0 0; }
  100% { background-position: -500px 500px, -300px 250px, -150px -150px; }
}

.cv-wrap::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background-image: 
    radial-gradient(1px 1px at 20px 30px, #ffffff, transparent),
    radial-gradient(1.5px 1.5px at 150px 100px, var(--accent), transparent),
    radial-gradient(2px 2px at 250px 300px, var(--accent2), transparent);
  background-size: 250px 250px, 350px 350px, 500px 500px;
  animation: starDrift 90s linear infinite; 
  opacity: 0.7; transition: opacity 0.5s;
}

.cv-wrap::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px; opacity: 0.08; transition: opacity 0.5s;
}

canvas { 
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
  touch-action: none; z-index: 1;
}

/* --- ANIMACIONES Y ESTILOS PARA EL MODO CLARO ÉPICO --- */
@keyframes auroraLight {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes floatOrbs {
  0%, 100% { background-position: 0% 0%, 100% 100%, 50% 50%; }
  50% { background-position: 5% 5%, 95% 95%, 45% 45%; }
}

[data-theme="light"] .cv-wrap {
  background: linear-gradient(-45deg, #f0f0f5, #e4ebfa, #f0f9e8, #fdf5e6);
  background-size: 400% 400%; animation: auroraLight 25s ease infinite;
}

[data-theme="light"] .cv-wrap::after {
  background-image: 
    radial-gradient(800px circle at 0% 0%, rgba(0, 85, 160, 0.06), transparent 70%),
    radial-gradient(800px circle at 100% 100%, rgba(74, 104, 0, 0.06), transparent 70%),
    radial-gradient(600px circle at 50% 50%, rgba(192, 112, 0, 0.04), transparent 70%);
  background-size: 150% 150%, 150% 150%, 150% 150%;
  background-repeat: no-repeat; animation: floatOrbs 18s ease-in-out infinite; opacity: 1;
}

[data-theme="light"] .cv-wrap::before { opacity: 0.15; }

/* ══════════════════════════════════════
   OVERLAYS E INTERFAZ DEL ÁRBOL
══════════════════════════════════════ */
.traversals {
  position: absolute; top: 14px; right: 14px; left: auto;
  background: rgba(28, 28, 34, 0.85); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 8px; z-index: 5; pointer-events: none;
  box-shadow: 0 4px 15px var(--shadow);
}

[data-theme="light"] .traversals { background: rgba(245, 245, 250, 0.85); }

.trav-row { display: flex; align-items: baseline; gap: 8px; font-size: 11px; }
.trav-lbl { color: var(--accent2); font-weight: 700; width: 65px; flex-shrink: 0; }
.trav-val { color: var(--text); word-break: break-all; max-width: 300px; line-height: 1.4; }

.banner {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 20px; font-size: 12px; font-weight: 500; color: var(--text); 
  opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
  box-shadow: 0 4px 20px var(--shadow); max-width: 90%; text-align: center; z-index: 5;
}

.banner.on { opacity: 1; }
.banner.cmp { border-color: var(--accent2); color: var(--accent2); }
.banner.rot { border-color: var(--warn); color: var(--warn); }
.banner.ok { border-color: var(--accent); color: var(--accent); }
.banner.bad { border-color: var(--danger); color: var(--danger); }

.zoom { 
  position: absolute; bottom: 14px; right: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 10; 
}

.zbtn {
  width: 36px; height: 36px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 18px; font-weight: bold; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
  box-shadow: 0 2px 8px var(--shadow);
}

.zbtn:hover { border-color: var(--accent); color: var(--accent); }

.legend {
  position: absolute; bottom: 14px; left: 14px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
  display: flex; flex-direction: column; gap: 6px; z-index: 10;
  box-shadow: 0 2px 8px var(--shadow);
}

.leg-item { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--muted); }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid; }

.toast {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 20px; font-size: 12px; font-weight: bold; color: var(--text);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1); pointer-events: none;
  white-space: nowrap; z-index: 20; box-shadow: 0 4px 20px var(--shadow);
}

.toast.on { transform: translateX(-50%) translateY(0); }
.toast.acc { border-color: var(--accent); color: var(--accent); }
.toast.err { border-color: var(--danger); color: var(--danger); }

/* ══════════════════════════════════════
   MEDIA QUERIES - DISEÑO SIDEBAR MÓVIL
══════════════════════════════════════ */
@media (max-width: 768px) {
  .hdr { padding: 10px 14px; gap: 10px; }
  .hdr-tag, .stat-lbl { display: none; }
  .stats { gap: 10px; }
  .stat::before { content: '🔸'; font-size: 7px; margin-right: 4px; color: var(--accent2); }
  .menu-btn-mobile { display: flex; font-size: 18px; flex-shrink: 0; }
  .hdr-title { flex-grow: 1; }

  .toolbar {
    position: fixed; top: 0; left: -320px; right: auto; width: 300px; max-width: 85vw; height: 100dvh;
    flex-direction: column; align-items: stretch; justify-content: flex-start; z-index: 100; padding: 20px;
    box-shadow: 5px 0 25px rgba(0,0,0,0.7); overflow-y: auto; box-sizing: border-box; 
  }

  .toolbar.open { left: 0; }

  .mobile-menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
  .mobile-menu-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; color: var(--text); }
  .close-menu-btn { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 5px; }

  .sec { border-right: none; border-bottom: 1px solid var(--border); padding-right: 0; padding-bottom: 18px; margin-bottom: 18px; width: 100%; box-sizing: border-box; }
  .sec:last-child { border-bottom: none; margin-bottom: 0; }

  .row { flex-wrap: nowrap; width: 100%; box-sizing: border-box; }
  input[type=number] { flex: 1; width: 100%; height: 42px; font-size: 16px; min-width: 0; }
  .btn { height: 42px; font-size: 13px; flex-shrink: 0; width: auto; }
  #pSize { flex: none; width: 65px; }

  .log-sec { height: 200px; max-width: 100%; }

  .traversals { top: auto; bottom: 85px; left: 10px; right: 10px; padding: 10px; font-size: 10px; }
  .trav-row { flex-wrap: wrap; gap: 4px; }
  .trav-lbl { width: 100%; }

  .legend { bottom: auto; top: calc(100% - 60px); left: 10px; right: 60px; flex-direction: row; flex-wrap: wrap; padding: 6px 10px; }
  .leg-item { font-size: 9px; }
  .zoom { right: 10px; bottom: 20px; }
}

.credit-footer {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 1px; color: var(--accent2); opacity: 0.85; z-index: 10;
  text-decoration: none; white-space: nowrap; transition: all .2s; cursor: pointer;
}

.credit-footer:hover { opacity: 1; color: var(--accent); text-shadow: 0 0 8px var(--accent2); }

@media (max-width: 768px) {
  .credit-footer { bottom: 3px; font-size: 9px; }
}
</style>
</head>
<body>
<div class="app">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>

<header class="hdr">
  <button class="hbtn menu-btn-mobile" onclick="toggleMenu()" title="Menú">☰</button>
  
<h1 class="hdr-title">AVL <em>Tree</em> Pro</h1>
  <div class="hdr-tag" data-i="tag">Árbol auto-balanceado</div>
  
  <div class="hdr-right">
    <div class="stats">
      <div class="stat"><span class="stat-lbl" data-i="snodes">nodos</span><span class="stat-n" id="sN">0</span></div>
      <div class="stat"><span class="stat-lbl" data-i="sheight">altura</span><span class="stat-n" id="sH">0</span></div>
      <div class="stat"><span class="stat-lbl" data-i="srot">rotaciones</span><span class="stat-n" id="sR">0</span></div>
    </div>
    <select class="lang-sel" id="langSel" onchange="setLang(this.value)">
      <option value="es">ES</option>
      <option value="en">EN</option>
      <option value="fr">FR</option>
      <option value="pt">PT</option>
    </select>
    <button class="hbtn" id="undoBtn" onclick="doUndo()" title="Deshacer" disabled>↶</button>
    <button class="hbtn" id="pauseBtn" onclick="togglePause()" title="Pausar / Reanudar">⏸</button>
    <button class="hbtn" id="redoBtn" onclick="doRedo()" title="Rehacer" disabled>↷</button>
    <button class="hbtn" id="themeBtn" onclick="toggleTheme()">☀</button>
    <button class="hbtn" id="micBtn" onclick="toggleMic()">🎙</button>
  </div>
</header>

<nav class="toolbar" id="toolbar">
  <div class="mobile-menu-header">
    <span class="mobile-menu-title">Herramientas</span>
    <button class="close-menu-btn" onclick="toggleMenu()">✕</button>
  </div>

  <div class="sec">
    <div class="sec-lbl">Operaciones</div>

/* ══════════════════════════════════════
   ESTRUCTURA DEL NODO AVL Y RECORRIDOS
══════════════════════════════════════ */
class Node {
  constructor(value) {
    this.v = value; 
    this.l = null; 
    this.r = null; 
    this.h = 1;
    this.x = 0; 
    this.y = 0; 
    this.tx = 0; 
    this.ty = 0;
    this.a = 0; 
    this.sc = 0.15; 
    this.pulse = 0; 
    this.col = 'def';
  }
}

function getPreOrder(node, arr = []) {
  if (!node) return arr; 
  arr.push(node.v); 
  getPreOrder(node.l, arr); 
  getPreOrder(node.r, arr); 
  return arr;
}

function getInOrder(node, arr = []) {
  if (!node) return arr; 
  getInOrder(node.l, arr); 
  arr.push(node.v); 
  getInOrder(node.r, arr); 
  return arr;
}

function getPostOrder(node, arr = []) {
  if (!node) return arr; 
  getPostOrder(node.l, arr); 
  getPostOrder(node.r, arr); 
  arr.push(node.v); 
  return arr;
}

function updateTraversalsUI() {
  const elPre = document.getElementById('tPre'); 
  const elIn = document.getElementById('tIn'); 
  const elPos = document.getElementById('tPos');
  
  if (!AVL.root) { 
    elPre.textContent = '-'; 
    elIn.textContent = '-'; 
    elPos.textContent = '-'; 
    return; 
  }
  
  elPre.textContent = getPreOrder(AVL.root).join(', ');
  elIn.textContent = getInOrder(AVL.root).join(', ');
  elPos.textContent = getPostOrder(AVL.root).join(', ');
}

/* ══════════════════════════════════════
   GUARDADO LOCAL (LOCALSTORAGE) Y COMPARTIR URL
══════════════════════════════════════ */
function saveCurrentTree() {
  if (busy || !AVL.root) { 
    showToast(T('empty'), 'err'); 
    return; 
  }
  
  const values = getPreOrder(AVL.root);
  const savedData = JSON.parse(localStorage.getItem('avl_saves') || '[]');
  const date = new Date();
  const dateString = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  
  savedData.unshift({ id: Date.now(), date: dateString, nodes: values });
  localStorage.setItem('avl_saves', JSON.stringify(savedData));
  
  renderSavedList(); 
  showToast('Estado guardado', 'acc');
}

// ════ FUNCIÓN NUEVA: COMPARTIR ÁRBOL POR URL ════
function shareTree() {
  if (busy || !AVL.root) { 
    showToast(T('empty'), 'err'); 
    return; 
  }
  const nodes = getPreOrder(AVL.root).join(',');
  const url = new URL(window.location.href);
  url.searchParams.set('tree', nodes);
  
  navigator.clipboard.writeText(url.toString()).then(() => {
    showToast('¡Enlace copiado al portapapeles!', 'acc');
    log(`🔗 Enlace generado para ${countNodes(AVL.root)} nodos`, 'inf');
  }).catch(() => {
    showToast('Error al copiar el enlace', 'err');
  });
}

function renderSavedList() {
  const listContainer = document.getElementById('savedList');
  const savedData = JSON.parse(localStorage.getItem('avl_saves') || '[]');
  
  listContainer.innerHTML = '';
  
  if (savedData.length === 0) {
    listContainer.innerHTML = `<div style="font-size:10px; color:var(--muted); text-align:center; padding:10px 0;">Vacío</div>`;
    return;
  }
  
  savedData.forEach(save => {
    const item = document.createElement('div');
    item.style = "background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; display: flex; align-items: center; justify-content: space-between;";
    item.innerHTML = `
      <div style="display: flex; flex-direction: column; gap: 1px; font-size: 10px;">
        <span style="color:var(--text); font-weight:700;">${save.nodes.length} nodos</span>
        <span style="color:var(--muted); font-size: 8px;">${save.date}</span>
      </div>
      <div style="display: flex; gap: 4px;">
        <button class="hbtn" style="width:24px; height:24px; font-size:11px;" onclick="loadSavedTree(${save.id})" title="Cargar">📂</button>
        <button class="hbtn" style="width:24px; height:24px; font-size:11px; color:var(--danger); border-color:var(--danger);" onclick="deleteSavedTree(${save.id})" title="Eliminar">🗑</button>
      </div>
    `;
    listContainer.appendChild(item);
  });
}

function loadSavedTree(id) {
  if (busy) return;
  const savedData = JSON.parse(localStorage.getItem('avl_saves') || '[]');
  const entry = savedData.find(s => s.id === id);
  
  if (entry) {
    doClear();
    entry.nodes.forEach(value => { 
      AVL.root = silIns(AVL.root, value); 
    });
    
    log(`↓ ${T('loaded')} [${entry.nodes.length} nodos]`, 'inf');
    saveState(); 
    showToast(T('loaded'), 'acc');
    autoFit(); // Ajustar zoom automáticamente
    if (window.innerWidth <= 768) toggleMenu();
  }
}

function deleteSavedTree(id) {
  let savedData = JSON.parse(localStorage.getItem('avl_saves') || '[]');
  savedData = savedData.filter(s => s.id !== id);
  localStorage.setItem('avl_saves', JSON.stringify(savedData));
  renderSavedList();
}

/* ══════════════════════════════════════
   HISTORIAL EN VIVO (DESHACER / REHACER)
══════════════════════════════════════ */
let historyData = []; 
let historyIndex = -1;

function cloneTreeLogic(node) {
  if (!node) return null;
  const newNode = new Node(node.v); 
  newNode.h = node.h;
  newNode.l = cloneTreeLogic(node.l); 
  newNode.r = cloneTreeLogic(node.r);
  return newNode;
}

function saveState() {
  if (historyIndex < historyData.length - 1) { 
    historyData = historyData.slice(0, historyIndex + 1); 
  }
  
  historyData.push({ 
    root: cloneTreeLogic(AVL.root), 
    rc: AVL.rc 
  });
  
  historyIndex++; 
  updateUndoRedoUI(); 
  updateTraversalsUI();
}

function updateUndoRedoUI() {
  document.getElementById('undoBtn').disabled = (historyIndex <= 0);
  document.getElementById('redoBtn').disabled = (historyIndex >= historyData.length - 1);
}

function getVisualMap(node, map = {}) {
  if (!node) return map;
  map[node.v] = { x: node.x, y: node.y, a: node.a, sc: node.sc };
  getVisualMap(node.l, map); 
  getVisualMap(node.r, map); 
  return map;
}

function applyVisualMap(node, map) {
  if (!node) return;
  if (map[node.v]) { 
    node.x = map[node.v].x; 
    node.y = map[node.v].y; 
    node.a = map[node.v].a; 
    node.sc = map[node.v].sc; 
  } else { 
    node.a = 0; 
    node.sc = 0.01; 
    node.x = 0; 
    node.y = 0; 
  }
  applyVisualMap(node.l, map); 
  applyVisualMap(node.r, map);
}

function doUndo() {
  if (busy || historyIndex <= 0) return;
  historyIndex--; 
  restoreState(historyData[historyIndex]); 
  log(`↺ Deshacer aplicado`, 'inf');
}

function doRedo() {
  if (busy || historyIndex >= historyData.length - 1) return;
  historyIndex++; 
  restoreState(historyData[historyIndex]); 
  log(`↻ Rehacer aplicado`, 'inf');
}

function restoreState(state) {
  const currentMap = getVisualMap(AVL.root);
  AVL.root = cloneTreeLogic(state.root); 
  AVL.rc = state.rc;
  applyVisualMap(AVL.root, currentMap); 
  doLayout(); 
  updateUndoRedoUI(); 
  updateTraversalsUI();
  autoFit();
}

/* ══════════════════════════════════════
   CONTROL DE ANIMACIÓN Y PAUSA
══════════════════════════════════════ */
let isPaused = false; 
let busy = false; 
let stepMs = 700;

function togglePause() {
  isPaused = !isPaused;
  const pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.textContent = isPaused ? '▶' : '⏸';
  
  if (isPaused) { 
    pauseBtn.classList.add('paused'); 
    log('⏸ Animación Pausada', 'wn'); 
    showToast('Pausado', 'rot'); 
  } else { 
    pauseBtn.classList.remove('paused'); 
    log('▶ Animación Reanudada', 'acc'); 
    showToast('Reanudado', 'acc'); 
  }
}

async function sleep(ms) {
  let elapsed = 0;
  while (elapsed < ms) {
    await new Promise(resolve => setTimeout(resolve, 40));
    if (!isPaused) {
      elapsed += 40;
    }
  }
}

/* ══════════════════════════════════════
   CURSOR Y NODOS FLOTANTES
══════════════════════════════════════ */
let curX = 0, curY = 0, curTarget = null, curPulse = 0; 
let floatingNode = null;

function setCursor(targetNode) {
  if (!targetNode) { 
    curTarget = null; 
    return; 
  }
  if (!curTarget) { 
    curX = targetNode.x; 
    curY = targetNode.y; 
  }
  curTarget = targetNode;
}

/* ══════════════════════════════════════
   ALGORITMOS CORE DEL ÁRBOL AVL
══════════════════════════════════════ */
const AVL = { root: null, rc: 0 };

function getHeight(node) { 
  return node ? node.h : 0; 
}

function getBalanceFactor(node) { 
  return node ? getHeight(node.l) - getHeight(node.r) : 0; 
}

function updateHeight(node) { 
  if (node) {
    node.h = 1 + Math.max(getHeight(node.l), getHeight(node.r));
  }
}

function rotateRight(y) { 
  AVL.rc++; 
  return performRotateRight(y); 
}

function rotateLeft(x) { 
  AVL.rc++; 
  return performRotateLeft(x); 
}

function performRotateRight(y) {
  const x = y.l; 
  const T2 = x.r; 
  
  x.r = y; 
  y.l = T2; 
  
  updateHeight(y); 
  updateHeight(x); 
  
  return x;
}

function performRotateLeft(x) {
  const y = x.r; 
  const T2 = y.l; 
  
  y.l = x; 
  x.r = T2; 
  
  updateHeight(x); 
  updateHeight(y); 
  
  return y;
}

function rotateLeftRight(node) {
  AVL.rc++; 
  const B = node.l; 
  const C = B.r; 
  
  B.r = C.l; 
  node.l = C.r; 
  C.l = B; 
  C.r = node;
  
  updateHeight(B); 
  updateHeight(node); 
  updateHeight(C); 
  
  return C;
}

function rotateRightLeft(node) {
  AVL.rc++; 
  const B = node.r; 
  const C = B.l; 
  
  B.l = C.r; 
  node.r = C.l; 
  C.r = B; 
  C.l = node;
  
  updateHeight(B); 
  updateHeight(node); 
  updateHeight(C); 
  
  return C;
}

async function rebalanceAsync(node, updateMe) {
  const balance = getBalanceFactor(node);
  
  setCursor(node); 
  node.col = 'path'; 
  node.pulse = 1;
  showBanner(T('checking_bal', { n: node.v, b: balance }), Math.abs(balance) > 1 ? 'rot' : 'cmp');
  await sleep(stepMs * 1.2);

  if (Math.abs(balance) <= 1) { 
    node.col = 'def'; 
    return; 
  }
  
  node.col = 'rot'; 
  showBanner(T('rot_why', { b: balance }), 'rot'); 
  await sleep(stepMs * 1.5);

  if (balance > 1 && getHeight(node.l.l) >= getHeight(node.l.r)) {
    curArrow = { pN: node, cN: node.l, dir: 'R', al: 1 };
    showBanner(T('rotR', { n: node.v }), 'rot'); 
    await sleep(stepMs * 2.5);
    
    let rotatedNode = rotateRight(node); 
    updateMe(rotatedNode); 
    
    curArrow = null; 
    setCursor(rotatedNode); 
    rotatedNode.col = 'rot'; 
    rotatedNode.pulse = 1;
    showBanner('Completado', 'rot'); 
    await sleep(stepMs); 
    return;
  }
  
  if (balance < -1 && getHeight(node.r.r) >= getHeight(node.r.l)) {
    curArrow = { pN: node, cN: node.r, dir: 'L', al: 1 };
    showBanner(T('rotL', { n: node.v }), 'rot'); 
    await sleep(stepMs * 2.5);
    
    let rotatedNode = rotateLeft(node); 
    updateMe(rotatedNode); 
    
    curArrow = null; 
    setCursor(rotatedNode); 
    rotatedNode.col = 'rot'; 
    rotatedNode.pulse = 1;
    showBanner('Completado', 'rot'); 
    await sleep(stepMs); 
    return;
  }
  
  if (balance > 1 && getHeight(node.l.l) < getHeight(node.l.r)) {
    const A = node; 
    const C = node.l.r;
    
    setCursor(A); 
    A.col = 'rot'; 
    A.l.col = 'rot'; 
    C.col = 'rot'; 
    A.pulse = 1;
    curArrow = { pN: A, cN: C, dir: 'R', txt: '↻ LR', al: 1 };
    showBanner(T('rotLR', { n: A.v }), 'rot'); 
    await sleep(stepMs * 2.5);
    
    let rotatedNode = rotateLeftRight(A); 
    updateMe(rotatedNode); 
    
    curArrow = null; 
    setCursor(rotatedNode); 
    rotatedNode.col = 'rot'; 
    rotatedNode.pulse = 1;
    showBanner('Completado', 'rot'); 
    await sleep(stepMs); 
    return;
  }
  
  if (balance < -1 && getHeight(node.r.r) < getHeight(node.r.l)) {
    const A = node; 
    const C = node.r.l;
    
    setCursor(A); 
    A.col = 'rot'; 
    A.r.col = 'rot'; 
    C.col = 'rot'; 
    A.pulse = 1;
    curArrow = { pN: A, cN: C, dir: 'L', txt: '↺ RL', al: 1 };
    showBanner(T('rotRL', { n: A.v }), 'rot'); 
    await sleep(stepMs * 2.5);
    
    let rotatedNode = rotateRightLeft(A); 
    updateMe(rotatedNode); 
    
    curArrow = null; 
    setCursor(rotatedNode); 
    rotatedNode.col = 'rot'; 
    rotatedNode.pulse = 1;
    showBanner('Completado', 'rot'); 
    await sleep(stepMs); 
    return;
  }
}

/* ══════════════════════════════════════
   OPERACIONES ANIMADAS
══════════════════════════════════════ */
async function insertAnimated(val) {
  busy = true; 
  clearNodeColors(AVL.root);
  floatingNode = new Node(val); 
  floatingNode.a = 0; 
  
  async function recursiveInsert(node, val, updateParentRef) {
    if (!node) {
      const newNode = floatingNode; 
      floatingNode = null; 
      newNode.col = 'new'; 
      newNode.pulse = 1; 
      
      setCursor(newNode); 
      updateParentRef(newNode); 
      
      showBanner(T('placed', { n: val }), 'ok'); 
      doLayout(); 
      await sleep(stepMs * 1.5); 
      return;
    }
    
    const message = val < node.v ? T('cmp_l', { v: val, n: node.v }) : val > node.v ? T('cmp_r', { v: val, n: node.v }) : T('cmp_eq', { v: val, n: node.v });
    
    setCursor(node); 
    node.col = 'path'; 
    node.pulse = 1; 
    showBanner(message, 'cmp'); 
    await sleep(stepMs * 1.2); 
    
    if (val < node.v) { 
      await recursiveInsert(node.l, val, n => node.l = n); 
    } else if (val > node.v) { 
      await recursiveInsert(node.r, val, n => node.r = n); 
    } else { 
      setCursor(node); 
      node.col = 'found'; 
      node.pulse = 1; 
      showBanner(T('exists'), 'ok'); 
      floatingNode = null; 
      await sleep(stepMs); 
      return; 
    }
    
    updateHeight(node); 
    await rebalanceAsync(node, updateParentRef); 
  }
  
  await recursiveInsert(AVL.root, val, n => AVL.root = n);
  
  curTarget = null; 
  hideBanner(); 
  clearNodeColors(AVL.root); 
  busy = false; 
  saveState(); 
  autoFit(); // Activar autozoom al finalizar inserción
}

async function deleteAnimated(val) {
  busy = true; 
  clearNodeColors(AVL.root); 
  floatingNode = null;
  
  async function recursiveDelete(node, val, updateParentRef) {
    if (!node) { 
      showBanner(`${val} ${T('notfound')}`, 'bad'); 
      await sleep(stepMs); 
      return; 
    }
    
    const isTarget = val === node.v;
    const message = val < node.v ? T('cmp_l', { v: val, n: node.v }) : val > node.v ? T('cmp_r', { v: val, n: node.v }) : T('cmp_eq', { v: val, n: node.v });
    
    setCursor(node); 
    node.col = isTarget ? 'rot' : 'path'; 
    node.pulse = 1; 
    showBanner(message, isTarget ? 'rot' : 'cmp'); 
    await sleep(stepMs * 1.2);
    
    if (val < node.v) { 
      await recursiveDelete(node.l, val, n => node.l = n); 
    } else if (val > node.v) { 
      await recursiveDelete(node.r, val, n => node.r = n); 
    } else {
      showBanner(T('del_here', { v: val }), 'bad'); 
      await sleep(stepMs);
      
      if (!node.l || !node.r) { 
        const childNode = node.l || node.r; 
        updateParentRef(childNode); 
        node = childNode; 
      } else {
        let successor = node.l; 
        setCursor(successor); 
        successor.col = 'path'; 
        successor.pulse = 1; 
        showBanner(`Buscando predecesor…`, 'cmp'); 
        await sleep(stepMs * 1.2);
        
        while (successor.r) { 
          successor = successor.r; 
          setCursor(successor); 
          successor.col = 'path'; 
          successor.pulse = 1; 
          showBanner(`Buscando predecesor…`, 'cmp'); 
          await sleep(stepMs * 1.2); 
        }
        
        setCursor(successor); 
        successor.col = 'found'; 
        successor.pulse = 1; 
        showBanner(`Predecesor: ${successor.v}`, 'ok'); 
        await sleep(stepMs * 1.5);
        
        const predecessorValue = successor.v; 
        node.v = predecessorValue; 
        
        await recursiveDelete(node.l, predecessorValue, n => node.l = n); 
      }
    }
    
    if (!node) return;
    
    updateHeight(node); 
    await rebalanceAsync(node, updateParentRef); 
  }
  
  await recursiveDelete(AVL.root, val, n => AVL.root = n);
  
  curTarget = null; 
  hideBanner(); 
  clearNodeColors(AVL.root); 
  busy = false; 
  saveState();
  autoFit();
}

async function findAnimated(val) {
  busy = true; 
  clearNodeColors(AVL.root); 
  floatingNode = null;
  
  async function recursiveFind(node, val) {
    if (!node) { 
      showBanner(`${val} ${T('notfound')}`, 'bad'); 
      await sleep(stepMs); 
      return; 
    }
    
    const isTarget = val === node.v;
    const message = val < node.v ? T('cmp_l', { v: val, n: node.v }) : val > node.v ? T('cmp_r', { v: val, n: node.v }) : T('cmp_eq', { v: val, n: node.v });
    
    setCursor(node); 
    node.col = isTarget ? 'found' : 'path'; 
    node.pulse = 1; 
    showBanner(message, isTarget ? 'ok' : 'cmp'); 
    await sleep(stepMs * 1.2);
    
    if (!isTarget) { 
      if (val < node.v) { 
        await recursiveFind(node.l, val); 
      } else { 
        await recursiveFind(node.r, val); 
      }
    }
  }
  
  await recursiveFind(AVL.root, val);
  
  curTarget = null; 
  hideBanner(); 
  clearNodeColors(AVL.root); 
  busy = false;
}

function silIns(node, val) {
  if (!node) { 
    const n = new Node(val); 
    n.a = 1; 
    n.sc = 1; 
    return n; 
  }
  
  if (val < node.v) { 
    node.l = silIns(node.l, val); 
  } else if (val > node.v) { 
    node.r = silIns(node.r, val); 
  } else { 
    return node; 
  }
  
  updateHeight(node); 
  
  const b = getBalanceFactor(node);
  
  if (b > 1 && getHeight(node.l.l) >= getHeight(node.l.r)) return rotateRight(node);
  if (b < -1 && getHeight(node.r.r) >= getHeight(node.r.l)) return rotateLeft(node);
  if (b > 1 && getHeight(node.l.l) < getHeight(node.l.r)) return rotateLeftRight(node);
  if (b < -1 && getHeight(node.r.r) < getHeight(node.r.l)) return rotateRightLeft(node);
  
  return node;
}

function clearNodeColors(node) {
  if (!node) return; 
  node.col = 'def'; 
  node.pulse = 0; 
  clearNodeColors(node.l); 
  clearNodeColors(node.r);
}

function countNodes(node) { 
  if (!node) return 0;
  return 1 + countNodes(node.l) + countNodes(node.r); 
}

function getTreeHeight() { 
  return getHeight(AVL.root); 
}

/* ══════════════════════════════════════
   MOTOR DE DIBUJO (CANVAS RENDERER) Y AUTO-FIT
══════════════════════════════════════ */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

const isMobile = () => window.innerWidth <= 768;

let panX = 0;
let panY = isMobile() ? 100 : 40; 
let currentScale = isMobile() ? 0.8 : 1; 

// ════ 3. VARIABLES PARA SISTEMA DE AUTO-ZOOM ════
let targetScale = currentScale;
let autoZoomEnabled = true;

function autoFit() {
  if (!autoZoomEnabled || !AVL.root) return;
  const W = canvas.offsetWidth;
  const H = canvas.offsetHeight;
  const treeW = layout(AVL.root, 0, 0);
  const treeH = getTreeHeight() * getVerticalGap();
  
  const maxScale = isMobile() ? 0.8 : 1;
  const minScale = 0.25;
  
  // Calcula la escala para que el árbol ocupe el 85% del ancho y 65% del alto
  let scaleX = (W * 0.85) / Math.max(treeW, 1);
  let scaleY = (H * 0.65) / Math.max(treeH, 1);
  
  targetScale = Math.max(minScale, Math.min(scaleX, scaleY, maxScale));
}

let isDragging = false, lastMouseX = 0, lastMouseY = 0;
let curArrow = null;

const NODE_RADIUS = 22; 

function getVerticalGap() { 
  return isMobile() ? 65 : 72; 
}

function getHorizontalGap() { 
  return isMobile() ? 35 : 50; 
}

function layout(node, depth, offset) {
  if (!node) return 0;
  
  const vGap = getVerticalGap();
  const hGap = getHorizontalGap();
  
  const leftWidth = layout(node.l, depth + 1, offset);
  node.tx = offset + leftWidth; 
  node.ty = depth * vGap;
  const rightWidth = layout(node.r, depth + 1, offset + leftWidth + hGap);
  
  return leftWidth + hGap + rightWidth;
}

function doLayout() {
  if (!AVL.root) return;
  const totalWidth = layout(AVL.root, 0, 0); 
  shiftTreeX(AVL.root, -totalWidth / 2);
}

function shiftTreeX(node, deltaX) {
  if (!node) return; 
  node.tx += deltaX; 
  shiftTreeX(node.l, deltaX); 
  shiftTreeX(node.r, deltaX);
}

function interpolate(start, end, factor) { 
  return start + (end - start) * factor; 
}

function animateNodes(node) {
  if (!node) return;
  
  const speed = Math.min(0.12, 0.032 * animSpd);
  
  if (!isPaused) {
    node.x = interpolate(node.x, node.tx, speed); 
    node.y = interpolate(node.y, node.ty, speed);
    node.a = interpolate(node.a, 1, speed * 1.8); 
    node.sc = interpolate(node.sc, 1, speed * 1.8);
    node.pulse = interpolate(node.pulse, 0, 0.03 * animSpd);
  }
  
  animateNodes(node.l); 
  animateNodes(node.r);
}

const COLORS_DARK = {
  def: { f: '#1a1a26', s: '#3a3a58', t: '#e8e8f0' }, 
  new: { f: '#0d2233', s: '#47c8ff', t: '#47c8ff' },
  found: { f: '#1e2a0d', s: '#d0e830', t: '#d0e830' }, 
  rot: { f: '#2a1500', s: '#ffb347', t: '#ffb347' },
  path: { f: '#1a1a2e', s: '#8a8aff', t: '#8a8aff' }
};

const COLORS_LIGHT = {
  def: { f: '#ffffff', s: '#b0b0cc', t: '#16161e' }, 
  new: { f: '#ddf0ff', s: '#0080c0', t: '#004070' },
  found: { f: '#eeffcc', s: '#4a6800', t: '#2a4000' }, 
  rot: { f: '#fff0d8', s: '#c07000', t: '#804000' },
  path: { f: '#ebebff', s: '#5050cc', t: '#2a2a90' }
};

function getNodeColor(colorKey) { 
  return (dark ? COLORS_DARK : COLORS_LIGHT)[colorKey] || (dark ? COLORS_DARK : COLORS_LIGHT).def; 
}

function drawEdges(node) {
  if (!node) return;
  const edgeColor = dark ? '#3a3a58' : '#16161e';
  
  if (node.l) {
    ctx.save(); 
    ctx.globalAlpha = Math.min(node.a, node.l.a) * 0.85; 
    ctx.strokeStyle = edgeColor; 
    ctx.lineWidth = 2;
    ctx.beginPath(); 
    ctx.moveTo(node.x, node.y); 
    ctx.lineTo(node.l.x, node.l.y); 
    ctx.stroke(); 
    ctx.restore(); 
    
    drawEdges(node.l);
  }
  
  if (node.r) {
    ctx.save(); 
    ctx.globalAlpha = Math.min(node.a, node.r.a) * 0.85; 
    ctx.strokeStyle = edgeColor; 
    ctx.lineWidth = 2;
    ctx.beginPath(); 
    ctx.moveTo(node.x, node.y); 
    ctx.lineTo(node.r.x, node.r.y); 
    ctx.stroke(); 
    ctx.restore(); 
    
    drawEdges(node.r);
  }
}

function drawArrow(arrow) {
  if (!arrow) return; 
  
  const p = arrow.pN, c = arrow.cN; 
  if (!p || !c) return;
  
  const x1 = p.x, y1 = p.y, x2 = c.x, y2 = c.y; 
  const arrowColor = '#ff1744'; 
  
  ctx.save(); 
  ctx.globalAlpha = arrow.al * 0.95; 
  ctx.strokeStyle = arrowColor; 
  ctx.lineWidth = 5; 
  ctx.shadowColor = arrowColor; 
  ctx.shadowBlur = 15; 
  
  ctx.beginPath(); 
  ctx.moveTo(x1, y1); 
  ctx.lineTo(x2, y2); 
  ctx.stroke();
  
  const mx = (x1 + x2) / 2; 
  const my = (y1 + y2) / 2; 
  const dx = x2 - x1; 
  const dy = y2 - y1; 
  const length = Math.sqrt(dx * dx + dy * dy);
  
  let px = 0, py = 0; 
  if (length > 0) { 
    px = -dy / length * 22; 
    py = dx / length * 22; 
  }
  
  ctx.fillStyle = arrowColor; 
  ctx.shadowColor = arrowColor; 
  ctx.shadowBlur = 10; 
  ctx.font = 'bold 14px DM Mono'; 
  ctx.textAlign = 'center'; 
  ctx.textBaseline = 'middle';
  
  const arrowText = arrow.txt || (arrow.dir === 'R' ? '↻ R' : '↺ L'); 
  ctx.fillText(arrowText, mx + px, my + py);
  
  ctx.restore();
}

function drawCursor() {
  if (!curTarget) return; 
  
  const speed = Math.min(0.25, 0.12 * animSpd);
  
  if (!isPaused) { 
    curX = interpolate(curX, curTarget.x, speed); 
    curY = interpolate(curY, curTarget.y, speed); 
    curPulse += 0.1; 
  }
  
  ctx.save(); 
  ctx.translate(curX, curY); 
  ctx.beginPath(); 
  ctx.arc(0, 0, NODE_RADIUS + 8 + Math.sin(curPulse) * 3, 0, Math.PI * 2);
  ctx.strokeStyle = '#e8ff47'; 
  ctx.lineWidth = 3; 
  ctx.shadowColor = '#e8ff47'; 
  ctx.shadowBlur = 8; 
  ctx.stroke(); 
  ctx.restore();
}

function drawSingleNode(node) {
  if (!node) return; 
  
  const color = getNodeColor(node.col); 
  
  ctx.save(); 
  ctx.globalAlpha = node.a; 
  ctx.translate(node.x, node.y); 
  ctx.scale(node.sc, node.sc);
  
  if (node.pulse > 0.05) {
    ctx.beginPath(); 
    ctx.arc(0, 0, NODE_RADIUS + 4 + node.pulse * 9, 0, Math.PI * 2); 
    ctx.strokeStyle = color.s; 
    ctx.lineWidth = 2; 
    ctx.globalAlpha = node.a * node.pulse * 0.55; 
    ctx.stroke(); 
    ctx.globalAlpha = node.a;
  }
  
  if (node.col !== 'def') { 
    ctx.shadowColor = color.s; 
    ctx.shadowBlur = 14 + node.pulse * 10; 
  }
  
  ctx.beginPath(); 
  ctx.arc(0, 0, NODE_RADIUS, 0, Math.PI * 2); 
  ctx.fillStyle = color.f; 
  ctx.fill(); 
  
  ctx.strokeStyle = color.s; 
  ctx.lineWidth = node.col !== 'def' ? 2.5 : 1.5; 
  ctx.stroke(); 
  ctx.shadowBlur = 0;
  
  const balance = getBalanceFactor(node); 
  let balanceColor = dark ? '#3a3a58' : '#b8b8cc';
  
  if (Math.abs(balance) > 1) { 
    balanceColor = dark ? '#ff6b6b' : '#c02020'; 
  } else if (Math.abs(balance) === 1) { 
    balanceColor = dark ? '#ffb347' : '#b06000'; 
  }
  
  ctx.fillStyle = balanceColor; 
  ctx.font = '7px DM Mono'; 
  ctx.textAlign = 'center'; 
  ctx.textBaseline = 'middle'; 
  ctx.fillText((balance >= 0 ? '+' : '') + balance, 0, -NODE_RADIUS - 9);
  
  ctx.fillStyle = color.t; 
  ctx.font = '500 13px DM Mono'; 
  ctx.textAlign = 'center'; 
  ctx.textBaseline = 'middle'; 
  ctx.fillText(node.v, 0, 0);
  
  ctx.restore(); 
  
  drawSingleNode(node.l); 
  drawSingleNode(node.r);
}

function renderCanvas() {
  canvas.width = canvas.offsetWidth * window.devicePixelRatio; 
  canvas.height = canvas.offsetHeight * window.devicePixelRatio; 
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  
  const W = canvas.offsetWidth; 
  const H = canvas.offsetHeight; 
  ctx.clearRect(0, 0, W, H); 
  
  doLayout(); 
  animateNodes(AVL.root);

  // Animación del zoom automático
  if (!isPaused) {
     currentScale = interpolate(currentScale, targetScale, 0.08);
  }

  if (floatingNode) {
    floatingNode.tx = 0; 
    floatingNode.ty = -getVerticalGap() * 1.5;
    
    if (floatingNode.a === 0) { 
      floatingNode.x = floatingNode.tx; 
      floatingNode.y = floatingNode.ty; 
      floatingNode.a = 0.01; 
    }
    
    animateNodes(floatingNode);
  }

  ctx.save(); 
  ctx.translate(W / 2 + panX, H / 4 + panY); 
  ctx.scale(currentScale, currentScale);
  
  if (!AVL.root && !floatingNode) {
    ctx.restore(); 
    ctx.save(); 
    ctx.globalAlpha = 0.2; 
    ctx.fillStyle = dark ? '#6b6b80' : '#8080a0'; 
    ctx.font = '13px DM Mono'; 
    ctx.textAlign = 'center'; 
    ctx.textBaseline = 'middle'; 
    ctx.fillText(T('empty'), W / 2, H / 2); 
    ctx.restore();
  } else {
    drawEdges(AVL.root);
    
    if (curArrow) { 
      if (!isPaused) { 
        curArrow.al = interpolate(curArrow.al, 0, 0.008 * animSpd); 
      }
      
      if (curArrow.al > 0.01) { 
        drawArrow(curArrow); 
      } else { 
        curArrow = null; 
      }
    }
    
    drawSingleNode(AVL.root); 
    
    if (floatingNode) { 
      drawSingleNode(floatingNode); 
    }
    
    drawCursor(); 
    ctx.restore();
  }
  
  document.getElementById('sN').textContent = countNodes(AVL.root); 
  document.getElementById('sH').textContent = getTreeHeight(); 
  document.getElementById('sR').textContent = AVL.rc;
  
  requestAnimationFrame(renderCanvas);
}

/* ══════════════════════════════════════
   INTERFAZ Y PRESETS DINÁMICOS
══════════════════════════════════════ */
let animSpd = 3;

function setSpeed(value) { 
  const roundedValue = Math.round(+value * 2) / 2; 
  animSpd = +roundedValue; 
  stepMs = Math.round(2000 / roundedValue); 
  document.getElementById('spdVal').textContent = roundedValue + 'x'; 
}

function doInsert() {
  if (busy) return; 
  
  const inputEl = document.getElementById('iVal'); 
  const val = parseInt(inputEl.value);
  
  if (isNaN(val) || val < -9999 || val > 9999) { 
    showToast(T('invalid'), 'err'); 
    return; 
  }
  
  log(`⊕ ${T('ins')} ${val}`, 'hl'); 
  insertAnimated(val); 
  inputEl.value = ''; 
  inputEl.blur(); 
  showToast(`${T('ins_ok')} ${val}`, 'acc');
  
  if (window.innerWidth <= 768) toggleMenu();
}

function doDelete() {
  if (busy) return; 
  
  const inputEl = document.getElementById('dVal'); 
  const val = parseInt(inputEl.value);
  
  if (isNaN(val)) { 
    showToast(T('invalid'), 'err'); 
    return; 
  }
  
  log(`⊖ ${T('del')} ${val}`, 'hl'); 
  deleteAnimated(val); 
  inputEl.value = ''; 
  inputEl.blur();
  
  if (window.innerWidth <= 768) toggleMenu();
}

function doFind() {
  if (busy) return; 
  
  const inputEl = document.getElementById('fVal'); 
  const val = parseInt(inputEl.value);
  
  if (isNaN(val)) { 
    showToast(T('invalid'), 'err'); 
    return; 
  }
  
  log(`? ${T('find')} ${val}`, 'inf'); 
  findAnimated(val); 
  inputEl.value = ''; 
  inputEl.blur();
  
  if (window.innerWidth <= 768) toggleMenu();
}

function doClear() {
  if (isPaused) togglePause();
  
  busy = false; 
  curArrow = null; 
  curTarget = null; 
  floatingNode = null; 
  AVL.root = null; 
  AVL.rc = 0;
  
  hideBanner(); 
  log(`— ${T('cleared')}`, ''); 
  showToast(T('cleared')); 
  saveState();
  autoFit();
  
  if (window.innerWidth <= 768) toggleMenu();
}

function generateBalancedArray(min, max) {
  if (min > max) return [];
  const mid = Math.floor((min + max) / 2);
  return [mid, ...generateBalancedArray(min, mid - 1), ...generateBalancedArray(mid + 1, max)];
}

function loadDynamicPreset(type, forceSize) {
  const inputEl = document.getElementById('pSize');
  let size = forceSize || parseInt(inputEl.value) || 7;
  
  if (size < 1) size = 1; 

  doClear(); 
  let array = [];
  
  if (type === 'bal') { 
    array = generateBalancedArray(1, size); 
  } else if (type === 'seq') { 
    for (let i = 1; i <= size; i++) array.push(i); 
  } else if (type === 'rnd') {
    const usedNumbers = new Set();
    for (let i = 0; i < size; i++) { 
      let rndValue; 
      do { 
        rndValue = Math.floor(Math.random() * 99) + 1; 
      } while(usedNumbers.has(rndValue)); 
      
      usedNumbers.add(rndValue); 
      array.push(rndValue); 
    }
  }
  
  array.forEach(val => { 
    AVL.root = silIns(AVL.root, val); 
  }); 
  
  log(`↓ Preset [${size} nodos]`, 'inf'); 
  saveState();
  autoFit();
  
  if (window.innerWidth <= 768) toggleMenu();
}

/* MENSAJERÍA UI (TOAST Y BANNER) */
let bannerTimer; 

function showBanner(msg, type = 'cmp') { 
  const bannerEl = document.getElementById('banner'); 
  bannerEl.textContent = msg; 
  bannerEl.className = `banner on ${type}`; 
  clearTimeout(bannerTimer); 
  bannerTimer = setTimeout(hideBanner, stepMs * 2.2); 
}

function hideBanner() { 
  document.getElementById('banner').className = 'banner'; 
}

let toastTimer; 

function showToast(msg, type = '') { 
  const toastEl = document.getElementById('toast'); 
  toastEl.textContent = msg; 
  toastEl.className = 'toast on' + (type ? ' ' + type : ''); 
  clearTimeout(toastTimer); 
  toastTimer = setTimeout(() => toastEl.className = 'toast', 1900); 
}

/* LOG SYSTEM */
let logCounter = 0; 

function log(msg, type = '') {
  if (!msg) return; 
  
  const container = document.getElementById('logBody'); 
  const entry = document.createElement('div');
  
  entry.className = 'log-entry' + (type ? ' ' + type : ''); 
  entry.textContent = String(logCounter++).padStart(3, '0') + '  ' + msg;
  container.appendChild(entry); 
  
  if (container.children.length > 160) { 
    container.removeChild(container.children[0]); 
  }
  
  container.scrollTop = container.scrollHeight;
}

/* ══════════════════════════════════════
   CONTROLES DE RATÓN, TÁCTILES Y TECLADO
══════════════════════════════════════ */
canvas.addEventListener('mousedown', e => {
  isDragging = true; 
  lastMouseX = e.clientX; 
  lastMouseY = e.clientY; 
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('mouseup', () => { 
  isDragging = false; 
  canvas.style.cursor = 'default'; 
});

canvas.addEventListener('mousemove', e => {
  if (!isDragging) return; 
  panX += e.clientX - lastMouseX; 
  panY += e.clientY - lastMouseY;
  lastMouseX = e.clientX; 
  lastMouseY = e.clientY;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault(); 
  autoZoomEnabled = false; // Desactivar autozoom si el usuario hace zoom manual
  const scaleMultiplier = e.deltaY > 0 ? 0.9 : 1.1;
  targetScale = Math.max(0.25, Math.min(3, currentScale * scaleMultiplier));
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { 
    isDragging = true; 
    lastMouseX = e.touches[0].clientX; 
    lastMouseY = e.touches[0].clientY; 
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (!isDragging || e.touches.length !== 1) return;
  panX += e.touches[0].clientX - lastMouseX; 
  panY += e.touches[0].clientY - lastMouseY;
  lastMouseX = e.touches[0].clientX; 
  lastMouseY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener('touchend', () => isDragging = false);

function zoomBy(factor) { 
  autoZoomEnabled = false;
  targetScale = Math.max(0.25, Math.min(3, currentScale * factor)); 
}

function resetView() { 
  panX = 0; 
  panY = isMobile() ? 100 : 40; 
  autoZoomEnabled = true;
  autoFit();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.activeElement === document.getElementById('iVal')) doInsert();
    if (document.activeElement === document.getElementById('dVal')) doDelete();
    if (document.activeElement === document.getElementById('fVal')) doFind();
  }
});

/* ══════════════════════════════════════
   SISTEMA DE RECONOCIMIENTO DE VOZ
══════════════════════════════════════ */
let recog = null; 
let micActive = false;

function initMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SpeechRecognition) { 
    showToast('Tu navegador no soporta voz', 'err'); 
    return null; 
  }
  
  const recognition = new SpeechRecognition(); 
  recognition.lang = curLang === 'es' ? 'es-ES' : curLang === 'en' ? 'en-US' : curLang === 'fr' ? 'fr-FR' : 'pt-BR'; 
  recognition.continuous = false; 
  recognition.interimResults = false;
  
  recognition.onresult = event => { 
    const textResult = event.results[0][0].transcript.toLowerCase().trim(); 
    log(`🎙 "${textResult}"`, 'inf'); 
    parseVoice(textResult); 
  };
  
  recognition.onend = () => { 
    if (micActive) { 
      setTimeout(() => { 
        try { recognition.start(); } catch(e) {} 
      }, 150); 
    } 
  };
  
  recognition.onerror = event => { 
    if (event.error === 'aborted' || event.error === 'no-speech') return; 
    showToast('Error de micrófono: ' + event.error, 'err'); 
  };
  
  return recognition;
}

function toggleMic() {
  const btn = document.getElementById('micBtn');
  
  if (micActive) { 
    micActive = false; 
    if (recog) recog.stop(); 
    btn.classList.remove('mic-on'); 
    btn.textContent = '🎙'; 
    showToast('Micrófono apagado'); 
  } else { 
    recog = initMic(); 
    if (!recog) return; 
    
    micActive = true; 
    recog.start(); 
    
    btn.classList.add('mic-on'); 
    btn.textContent = '🔴'; 
    showToast('Escuchando…'); 
  }
}

function parseVoice(textInput) {
  const cleanText = textInput.replace(/\b(el|la|los|las|un|una|número|numero|the|number|le|les|une|o|a|os|as|de)\b/g, '').replace(/\s+/g, ' ').trim();
  
  const wordNumbers = { 
    'cero': 0, 'zero': 0, 'uno': 1, 'una': 1, 'one': 1, 
    'dos': 2, 'two': 2, 'tres': 3, 'three': 3, 
    'cuatro': 4, 'four': 4, 'cinco': 5, 'five': 5, 
    'seis': 6, 'six': 6, 'siete': 7, 'seven': 7, 
    'ocho': 8, 'eight': 8, 'nueve': 9, 'nine': 9, 
    'diez': 10, 'ten': 10, 'quince': 15, 'veinte': 20, 
    'twenty': 20, 'treinta': 30, 'thirty': 30, 
    'cuarenta': 40, 'forty': 40, 'cincuenta': 50, 'fifty': 50 
  };
  
  function extractNumber(t) { 
    const match = t.match(/-?\d+/); 
    if (match) return parseInt(match[0]); 
    
    const words = t.split(/\s+/); 
    let total = 0; 
    let found = false; 
    
    for (const word of words) { 
      if (wordNumbers[word] !== undefined) { 
        total += wordNumbers[word]; 
        found = true; 
      } 
    } 
    return found ? total : null; 
  }
  
  const extractedNum = extractNumber(cleanText);

  if (/pausa|pausar|detener|pause|stop/.test(cleanText)) { 
    if (!isPaused) togglePause(); 
    return; 
  }
  
  if (/continuar|reanudar|play|resume|seguir/.test(cleanText)) { 
    if (isPaused) togglePause(); 
    return; 
  }
  
  if (/deshacer|atrás|atras|undo|retour|voltar/.test(cleanText)) { 
    doUndo(); 
    return; 
  }
  
  if (/rehacer|adelante|redo|refaire|refazer/.test(cleanText)) { 
    doRedo(); 
    return; 
  }
  
  if (/balanceado|balanced|équilibré/.test(cleanText)) { 
    loadDynamicPreset('bal', extractedNum !== null ? extractedNum : undefined); 
    return; 
  }
  
  if (/secuencial|sequential|séquentiel/.test(cleanText)) { 
    loadDynamicPreset('seq', extractedNum !== null ? extractedNum : undefined); 
    return; 
  }
  
  if (/aleatorio|random|aléatoire|azar/.test(cleanText)) { 
    loadDynamicPreset('rnd', extractedNum !== null ? extractedNum : undefined); 
    return; 
  }
  
  if (/inglés|ingles|english|anglais|inglês/.test(cleanText)) { 
    setLang('en'); 
    document.getElementById('langSel').value = 'en'; 
    showToast('Language: English'); 
    return; 
  }
  
  if (/español|espanol|spanish|espagnol/.test(cleanText)) { 
    setLang('es'); 
    document.getElementById('langSel').value = 'es'; 
    showToast('Idioma: Español'); 
    return; 
  }
  
  if (/oscuro|dark|sombre|escuro/.test(cleanText)) { 
    if (!dark) toggleTheme(); 
    showToast('Modo oscuro'); 
    return; 
  }
  
  if (/claro|light|clair/.test(cleanText)) { 
    if (dark) toggleTheme(); 
    showToast('Modo claro'); 
    return; 
  }

  if (/insertar|inserir|insert|agregar|añadir|add|meter|poner|coloca/.test(cleanText)) { 
    if (extractedNum === null) { 
      showToast('¿Qué número?', 'err'); 
      return; 
    } 
    document.getElementById('iVal').value = extractedNum; 
    doInsert(); 
    return; 
  }
  
  if (/eliminar|borrar|delete|remove|supprimer|remover|quitar|sacar/.test(cleanText)) { 
    if (extractedNum === null) { 
      showToast('¿Qué número?', 'err'); 
      return; 
    } 
    document.getElementById('dVal').value = extractedNum; 
    doDelete(); 
    return; 
  }
  
  if (/buscar|encontrar|find|search|chercher|busca|busque|dónde/.test(cleanText)) { 
    if (extractedNum === null) { 
      showToast('¿Qué número?', 'err'); 
      return; 
    } 
    document.getElementById('fVal').value = extractedNum; 
    doFind(); 
    return; 
  }
  
  if (/velocidad|speed|vitesse|rápido|lento|fast|slow/.test(cleanText)) {
    let speedVal = 3; 
    
    if (/rápido|rapido|fast|rapide|vite/.test(cleanText)) { 
      speedVal = 7; 
    } else if (/lento|slow|lent|despacio/.test(cleanText)) { 
      speedVal = 1; 
    } else if (extractedNum !== null && extractedNum >= 1 && extractedNum <= 10) { 
      speedVal = extractedNum; 
    }
    
    document.getElementById('spdSlider').value = speedVal; 
    setSpeed(speedVal); 
    showToast(`Velocidad: ${speedVal}x`); 
    return;
  }
  
  if (/limpiar|borrar todo|clear|vider|limpar|vaciar|reiniciar|reset/.test(cleanText)) { 
    doClear(); 
    return; 
  }
  
  if (/guardar|salvar|save|sauvegarder/.test(cleanText)) { 
    saveCurrentTree(); 
    return; 
  }

  showToast(`No entendí: "${textInput}"`, 'err'); 
  log(`🎙 no reconocido: "${textInput}"`, 'wn');
}

/* ══════════════════════════════════════
   INICIALIZACIÓN Y PWA Y CARGA DE ENLACES
══════════════════════════════════════ */
log(T('ready'), 'inf'); 
log(`— ${T('hint')}`, ''); 

setSpeed(3); 

// Registrar Service Worker (Para PWA)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW fallback', err));
  });
}

// ════ LEER ÁRBOL COMPARTIDO POR URL ════
const urlParams = new URLSearchParams(window.location.search);
const treeParam = urlParams.get('tree');
if (treeParam) {
  const nodes = treeParam.split(',').map(Number).filter(n => !isNaN(n));
  if (nodes.length > 0) {
    doClear();
    nodes.forEach(val => { AVL.root = silIns(AVL.root, val); });
    log(`↓ Árbol compartido cargado [${nodes.length} nodos]`, 'inf');
    
    // Limpiar la URL visualmente para que no se vea el string largo
    const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
    window.history.replaceState({path: cleanUrl}, '', cleanUrl);
  }
}

saveState(); 
renderSavedList(); 
renderCanvas();

/* ══════════════════════════════════════
   BLOQUEO BÁSICO DE INSPECCIÓN (NO ES SEGURIDAD REAL)
══════════════════════════════════════ */
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  if (e.key === 'F12') e.preventDefault();
  if (e.ctrlKey && e.shiftKey && ['I','J','C','i','j','c'].includes(e.key)) e.preventDefault();
  if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) e.preventDefault();
});
